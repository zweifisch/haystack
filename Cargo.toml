[package]
name = "haystack"
version = "0.12.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.13.0"
tiny_http = "0.12"
walkdir = "2.5"
orgize = "0.9"
syntect = { version = "5", features = ["html"] }
regex = "1"
once_cell = "1"
mime_guess = "2.0"
urlencoding = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
